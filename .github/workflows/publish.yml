name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify release ref and repository
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF !== `refs/tags/v${pkg.version}`) {
            throw new Error('Dispatch this workflow at the version tag matching package.json.');
          }
          const repository = `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`;
          if (pkg.repository?.url !== repository) {
            throw new Error('Set package.json repository.url to the real GitHub repository before releasing.');
          }
          NODE
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - name: Publish the verified tarball with provenance
        run: npm publish ./artifacts/mailrules-*.tgz --access public --provenance --ignore-scripts
